[package]
name = "name-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
rand = "0.10.3"
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
